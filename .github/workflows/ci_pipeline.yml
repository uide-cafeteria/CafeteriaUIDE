name: Caféteria UIDE CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job para el Backend (Node.js)
  build-and-test-backend:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./src/backend

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: ./src/backend/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Run Linter (Verificación de Estilo)
      # Simulado: Si tienes script de lint, descomenta la siguiente línea
      # run: npm run lint
      run: echo "Linting backend..."

    - name: Run Tests (Pruebas Unitarias)
      # Simulado: Ajustar comando según tu package.json
      # run: npm test
      run: echo "Running backend tests..."

  # Job para el Frontend Web (React)
  build-web:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./src/web

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: ./src/web/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Build React App
      run: npm run build

  # Job para Móvil (Flutter) - Comprobación básica
  analyze-mobile:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./src/movil

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'
        channel: 'stable'

    - name: Install Dependencies
      run: flutter pub get

    - name: Analyze Code (Linter)
      run: flutter analyze

    - name: Run Unit Tests
      run: flutter test
